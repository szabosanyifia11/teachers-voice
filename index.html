  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

 4 0 0 0-4 4v2\"><\u002Fpath><circle cx=\"9.5\" cy=\"7\" r=\"3.2\"><\u002Fcircle><path d=\"M17 11a3 3 0 1 0 0-6M21 20v-2a3.6 3.6 0 0 0-2.4-3.4\"><\u002Fpath><\u002Fsvg>\n                      {{ f.testerCount }} testers\n                    <\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"flex:0 0 auto; display:flex; align-items:center; position:relative\">\n                  <sc-if value=\"{{ f.burst }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"position:absolute; inset:0; pointer-events:none; display:flex; align-items:center; justify-content:center\">{{ f.sparks }}<\u002Fdiv>\n                  <\u002Fsc-if>\n                  <button type=\"button\" disabled=\"{{ f.voted }}\" sc-camel-on-click=\"{{ f.onVote }}\" style=\"{{ f.voteStyle }}\" style-hover=\"{{ f.voteHover }}\">\n                    <sc-if value=\"{{ f.showSmile }}\" hint-placeholder-val=\"{{ true }}\">\n                      <svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" style=\"flex:0 0 auto\"><path d=\"M7 10.5h2.2l2.6-5.9a1.7 1.7 0 0 1 3.2.7v3.6h3.1a2 2 0 0 1 2 2.4l-1.1 5.3A2.4 2.4 0 0 1 16.6 19H7v-8.5Z\" fill=\"#ffc44d\" stroke=\"#7a4d10\" stroke-width=\"1.5\" stroke-linejoin=\"round\"><\u002Fpath><rect x=\"3\" y=\"10\" width=\"4\" height=\"9.2\" rx=\"1.2\" fill=\"#ffc44d\" stroke=\"#7a4d10\" stroke-width=\"1.5\"><\u002Frect><\u002Fsvg>\n                    <\u002Fsc-if>\n                    <sc-if value=\"{{ f.showGrin }}\" hint-placeholder-val=\"{{ false }}\">\n                      <svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" style=\"flex:0 0 auto\"><path d=\"M7 10.5h2.2l2.6-5.9a1.7 1.7 0 0 1 3.2.7v3.6h3.1a2 2 0 0 1 2 2.4l-1.1 5.3A2.4 2.4 0 0 1 16.6 19H7v-8.5Z\" fill=\"#00a884\" stroke=\"#02513f\" stroke-width=\"1.5\" stroke-linejoin=\"round\"><\u002Fpath><rect x=\"3\" y=\"10\" width=\"4\" height=\"9.2\" rx=\"1.2\" fill=\"#00a884\" stroke=\"#02513f\" stroke-width=\"1.5\"><\u002Frect><\u002Fsvg>\n                    <\u002Fsc-if>\n                    {{ f.voteLabel }}\n                  <\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Farticle>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ showRoadmap }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin:38px 0 0; padding-top:28px; border-top:1px dashed #e0d5c5\">\n            <div style=\"display:flex; align-items:center; gap:10px; margin-bottom:8px\">\n              <span style=\"color:#7b5cff; display:flex; animation:floaty 3.8s ease-in-out infinite\">\n                <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M8 3h8l-1 5 4 5-3 8H8l-3-8 4-5-1-5Z\"><\u002Fpath><\u002Fsvg>\n              <\u002Fspan>\n              <h2 style=\"margin:0; font-size:13px; font-weight:800; letter-spacing:1.2px; text-transform:uppercase; color:#8a8071\">{{ roadmapHeading }}<\u002Fh2>\n              <div style=\"flex:1; height:2px; border-radius:2px; background:repeating-linear-gradient(90deg,#e4dbf7 0 8px,transparent 8px 14px)\"><\u002Fdiv>\n            <\u002Fdiv>\n            <p style=\"margin:0 0 16px; color:#5c5648; font-size:14px; line-height:1.6; max-width:690px; text-wrap:pretty\">Enough colleagues backed these, so they are accepted for development. Backing is closed — they are on their way.<\u002Fp>\n            <div style=\"display:flex; flex-direction:column; gap:12px\">\n              <sc-for list=\"{{ roadmapItems }}\" as=\"f\" hint-placeholder-count=\"2\">\n                <article sc-camel-on-click=\"{{ f.onOpen }}\" style=\"{{ f.cardStyle }}\" style-hover=\"transform:translateY(-3px); box-shadow:0 10px 22px rgba(80,60,30,.10)\">\n                  <div style=\"{{ f.medalStyle }}\">\n                    <span style=\"font-size:20px; font-weight:800; line-height:1\">{{ f.votes }}<\u002Fspan>\n                    <span style=\"font-size:10px; font-weight:800; letter-spacing:.5px; text-transform:uppercase\">likes<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"flex:1; min-width:0; display:flex; flex-direction:column; gap:8px\">\n                    <div style=\"display:flex; align-items:center; gap:10px; flex-wrap:wrap\">\n                      <span style=\"{{ f.topicStyle }}\">{{ f.topicLabel }}<\u002Fspan>\n                      <span style=\"{{ f.chipStyle }}\">{{ f.status }}<\u002Fspan>\n                      <h3 style=\"margin:0; font-size:17.5px; font-weight:700; letter-spacing:-.2px; flex:1 1 100%\">{{ f.title }}<\u002Fh3>\n                    <\u002Fdiv>\n                    <p style=\"margin:0; color:#5c5648; font-size:14px; line-height:1.55; text-wrap:pretty\">{{ f.body }}<\u002Fp>\n                  <\u002Fdiv>\n                <\u002Farticle>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ showBuilt }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin:38px 0 0; padding-top:28px; border-top:1px dashed #e0d5c5\">\n            <div style=\"display:flex; align-items:center; gap:10px; margin-bottom:8px\">\n              <span style=\"color:#c2610a; display:flex\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M14.7 6.3a4.5 4.5 0 0 0 6 6L15 18l-3 3-3-3 6-5.7Z\"><\u002Fpath><path d=\"m8 8 3-3-2-2-4 1-1 4 2 2 2-2Z\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n              <h2 style=\"margin:0; font-size:13px; font-weight:800; letter-spacing:1.2px; text-transform:uppercase; color:#8a8071\">{{ builtHeading }}<\u002Fh2>\n              <div style=\"flex:1; height:2px; border-radius:2px; background:repeating-linear-gradient(90deg,#f7dfb8 0 8px,transparent 8px 14px)\"><\u002Fdiv>\n            <\u002Fdiv>\n            <p style=\"margin:0 0 16px; color:#5c5648; font-size:14px; line-height:1.6; max-width:690px; text-wrap:pretty\">The team is building these right now. You can still join the discussion or put yourself in the test group.<\u002Fp>\n            <div style=\"display:flex; flex-direction:column; gap:12px\">\n              <sc-for list=\"{{ builtItems }}\" as=\"f\" hint-placeholder-count=\"3\">\n                <article sc-camel-on-click=\"{{ f.onOpen }}\" style=\"{{ f.cardStyle }}\" style-hover=\"transform:translateY(-3px); box-shadow:0 10px 22px rgba(80,60,30,.10)\">\n                  <div style=\"{{ f.medalStyle }}\">\n                    <span style=\"font-size:20px; font-weight:800; line-height:1\">{{ f.votes }}<\u002Fspan>\n                    <span style=\"font-size:10px; font-weight:800; letter-spacing:.5px; text-transform:uppercase\">likes<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"flex:1; min-width:0; display:flex; flex-direction:column; gap:8px\">\n                    <div style=\"display:flex; align-items:center; gap:10px; flex-wrap:wrap\">\n                      <span style=\"{{ f.topicStyle }}\">{{ f.topicLabel }}<\u002Fspan>\n                      <span style=\"{{ f.chipStyle }}\">{{ f.status }}<\u002Fspan>\n                      <h3 style=\"margin:0; font-size:17.5px; font-weight:700; letter-spacing:-.2px; flex:1 1 100%\">{{ f.title }}<\u002Fh3>\n                    <\u002Fdiv>\n                    <p style=\"margin:0; color:#5c5648; font-size:14px; line-height:1.55; text-wrap:pretty\">{{ f.body }}<\u002Fp>\n                  <\u002Fdiv>\n                <\u002Farticle>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ showDelivered }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin:38px 0 0; padding-top:28px; border-top:1px dashed #e0d5c5\">\n            <div style=\"display:flex; align-items:center; gap:10px; margin-bottom:8px\">\n              <span style=\"color:#146c50; display:flex\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\"><path d=\"m5 13 4.5 4.5L19 7\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n              <h2 style=\"margin:0; font-size:13px; font-weight:800; letter-spacing:1.2px; text-transform:uppercase; color:#8a8071\">{{ deliveredHeading }}<\u002Fh2>\n              <div style=\"flex:1; height:2px; border-radius:2px; background:repeating-linear-gradient(90deg,#c6e8d4 0 8px,transparent 8px 14px)\"><\u002Fdiv>\n            <\u002Fdiv>\n            <p style=\"margin:0 0 16px; color:#5c5648; font-size:14px; line-height:1.6; max-width:690px; text-wrap:pretty\">Live already, because teachers asked for it. Every one of these started as an idea on this page.<\u002Fp>\n            <div style=\"display:flex; flex-direction:column; gap:12px\">\n              <sc-for list=\"{{ deliveredItems }}\" as=\"f\" hint-placeholder-count=\"3\">\n                <article sc-camel-on-click=\"{{ f.onOpen }}\" style=\"{{ f.cardStyle }}\" style-hover=\"transform:translateY(-3px); box-shadow:0 10px 22px rgba(80,60,30,.10)\">\n                  <div style=\"{{ f.medalStyle }}\">\n                    <span style=\"font-size:20px; font-weight:800; line-height:1\">{{ f.votes }}<\u002Fspan>\n                    <span style=\"font-size:10px; font-weight:800; letter-spacing:.5px; text-transform:uppercase\">likes<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"flex:1; min-width:0; display:flex; flex-direction:column; gap:8px\">\n                    <div style=\"display:flex; align-items:center; gap:10px; flex-wrap:wrap\">\n                      <span style=\"{{ f.topicStyle }}\">{{ f.topicLabel }}<\u002Fspan>\n                      <span style=\"{{ f.chipStyle }}\">{{ f.status }}<\u002Fspan>\n                      <h3 style=\"margin:0; font-size:17.5px; font-weight:700; letter-spacing:-.2px; flex:1 1 100%\">{{ f.title }}<\u002Fh3>\n                    <\u002Fdiv>\n                    <p style=\"margin:0; color:#5c5648; font-size:14px; line-height:1.55; text-wrap:pretty\">{{ f.body }}<\u002Fp>\n                  <\u002Fdiv>\n                <\u002Farticle>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ showAchieved }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex; flex-direction:column; gap:12px\">\n            <sc-for list=\"{{ achievedItems }}\" as=\"f\" hint-placeholder-count=\"3\">\n              <article sc-camel-on-click=\"{{ f.onOpen }}\" style=\"{{ f.cardStyle }}\" style-hover=\"transform:translateY(-3px); box-shadow:0 10px 22px rgba(80,60,30,.10)\">\n                <div style=\"{{ f.medalStyle }}\">\n                  <span style=\"font-size:20px; font-weight:800; line-height:1\">{{ f.votes }}<\u002Fspan>\n                  <span style=\"font-size:10px; font-weight:800; letter-spacing:.5px; text-transform:uppercase\">backers<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"flex:1; min-width:0; display:flex; flex-direction:column; gap:8px\">\n                  <div style=\"display:flex; align-items:center; gap:10px; flex-wrap:wrap\">\n                    <span style=\"{{ f.topicStyle }}\">{{ f.topicLabel }}<\u002Fspan>\n                    <span style=\"{{ f.chipStyle }}\">{{ f.status }}<\u002Fspan>\n                    <h3 style=\"margin:0; font-size:17.5px; font-weight:700; letter-spacing:-.2px; flex:1 1 100%\">{{ f.title }}<\u002Fh3>\n                  <\u002Fdiv>\n                  <p style=\"margin:0; color:#5c5648; font-size:14px; line-height:1.55; text-wrap:pretty\">{{ f.body }}<\u002Fp>\n                <\u002Fdiv>\n              <\u002Farticle>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"background:#fff; border:1px solid #e9e0d2; border-radius:8px; padding:70px 32px; display:flex; flex-direction:column; align-items:center; text-align:center\">\n            <svg width=\"72\" height=\"72\" sc-camel-view-box=\"0 0 24 24\" style=\"margin-bottom:18px; animation:floaty 3.2s ease-in-out infinite\"><circle cx=\"12\" cy=\"12\" r=\"10\" fill=\"#ffc44d\"><\u002Fcircle><circle cx=\"8.6\" cy=\"10\" r=\"1.3\" fill=\"#7a4d10\"><\u002Fcircle><circle cx=\"15.4\" cy=\"10\" r=\"1.3\" fill=\"#7a4d10\"><\u002Fcircle><path d=\"M8.4 14.6c1.8 1.4 5.4 1.4 7.2 0\" stroke=\"#7a4d10\" stroke-width=\"1.8\" fill=\"none\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n            <h2 style=\"margin:0 0 8px; font-size:22px; font-weight:800\">{{ emptyTitle }}<\u002Fh2>\n            <p style=\"margin:0 0 24px; color:#5c5648; font-size:15px; line-height:1.6; max-width:430px; text-wrap:pretty\">{{ emptyBody }}<\u002Fp>\n            <div sc-camel-on-click=\"{{ goRequest }}\" style=\"background:#00806a; color:#fff; border:1px solid #00806a; border-radius:6px; padding:0 18px; height:42px; display:flex; align-items:center; font-weight:600; font-size:14px; cursor:pointer\" style-hover=\"background:#00604f; border-color:#00604f\">Tell us your idea<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isForm }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"padding:22px 34px 46px\">\n        <div style=\"background:#fff; border:1px solid #e9e0d2; border-radius:8px; padding:32px 32px 28px\">\n          <div style=\"display:flex; align-items:center; gap:12px; margin-bottom:6px\">\n            <svg width=\"30\" height=\"30\" sc-camel-view-box=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"10\" fill=\"#7b5cff\"><\u002Fcircle><circle cx=\"8.6\" cy=\"10\" r=\"1.3\" fill=\"#fff\"><\u002Fcircle><circle cx=\"15.4\" cy=\"10\" r=\"1.3\" fill=\"#fff\"><\u002Fcircle><path d=\"M8.4 14.2c1.8 1.6 5.4 1.6 7.2 0\" stroke=\"#fff\" stroke-width=\"1.8\" fill=\"none\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n            <h2 style=\"margin:0; font-size:21px; font-weight:800\">Your problem, your idea<\u002Fh2>\n          <\u002Fdiv>\n          <p style=\"margin:0 0 26px; color:#5c5648; font-size:14.5px; line-height:1.6; max-width:620px; text-wrap:pretty\">Tell us what gets in the way of your teaching, and what would make it better. Colleagues can back your idea, and once it reaches 150 backers it goes in progress.<\u002Fp>\n\n          <div style=\"display:flex; flex-direction:column; gap:22px\">\n            <div>\n              <div style=\"display:flex; align-items:baseline; gap:8px; margin-bottom:7px\">\n                <label style=\"font-size:14px; font-weight:700\">Title<\u002Flabel>\n                <span style=\"font-size:11.5px; font-weight:700; color:#b0492f; background:#ffe9e4; border-radius:4px; padding:2px 8px\">Required<\u002Fspan>\n              <\u002Fdiv>\n              <input value=\"{{ formTitle }}\" sc-camel-on-change=\"{{ onFormTitle }}\" placeholder=\"What is the problem, in one sentence?\" style=\"width:100%; height:44px; border:1px solid #cfd3d3; border-radius:6px; padding:0 14px; outline:none; color:#171c1c\" style-focus=\"border-color:#00a884; box-shadow:0 0 0 4px rgba(0,168,132,.14)\">\n            <\u002Fdiv>\n            <div>\n              <div style=\"display:flex; align-items:baseline; gap:8px; margin-bottom:9px\">\n                <label style=\"font-size:14px; font-weight:700\">Topic<\u002Flabel>\n                <span style=\"font-size:11.5px; font-weight:700; color:#5c5648; background:#f4eee5; border-radius:4px; padding:2px 8px\">Optional<\u002Fspan>\n                <span style=\"font-size:12px; color:#8a8071\">Helps colleagues find your idea<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:flex; align-items:center; gap:12px; flex-wrap:wrap\">\n                <div style=\"position:relative; flex:1; min-width:260px; max-width:420px\">\n                  <sc-raw-select value=\"{{ formTopic }}\" sc-camel-on-change=\"{{ onFormTopic }}\" style=\"width:100%; height:44px; border:1px solid #cfd3d3; border-radius:6px; padding:0 40px 0 13px; outline:none; background:#fff; color:#171c1c; appearance:none; cursor:pointer\" style-focus=\"border-color:#00a884; box-shadow:0 0 0 3px rgba(0,168,132,.14)\">\n                    <sc-for list=\"{{ topicOptions }}\" as=\"t\" hint-placeholder-count=\"8\">\n                      <option value=\"{{ t.key }}\">{{ t.label }}<\u002Foption>\n                    <\u002Fsc-for>\n                  <\u002Fsc-raw-select>\n                  <span style=\"position:absolute; right:13px; top:15px; color:#8a8071; pointer-events:none; display:flex\">\n                    <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\"><path d=\"m6 9 6 6 6-6\"><\u002Fpath><\u002Fsvg>\n                  <\u002Fspan>\n                <\u002Fdiv>\n                <span style=\"{{ formTopicChip }}\">{{ formTopicLabel }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div>\n              <div style=\"display:flex; align-items:baseline; gap:8px; margin-bottom:7px\">\n                <label style=\"font-size:14px; font-weight:700\">What do you want?<\u002Flabel>\n                <span style=\"font-size:11.5px; font-weight:700; color:#b0492f; background:#ffe9e4; border-radius:4px; padding:2px 8px\">Required<\u002Fspan>\n              <\u002Fdiv>\n              <textarea value=\"{{ formBody }}\" sc-camel-on-change=\"{{ onFormBody }}\" rows=\"5\" placeholder=\"Describe the thing you would like to see in the platform\" style=\"width:100%; border:1px solid #cfd3d3; border-radius:6px; padding:12px 14px; outline:none; resize:vertical; line-height:1.6; color:#171c1c\" style-focus=\"border-color:#00a884; box-shadow:0 0 0 4px rgba(0,168,132,.14)\"><\u002Ftextarea>\n              <div style=\"margin-top:9px; font-size:13px; color:#8a8071; display:flex; align-items:center; gap:7px\">\n                <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"10\" fill=\"#ffc44d\"><\u002Fcircle><circle cx=\"8.6\" cy=\"10.2\" r=\"1.2\" fill=\"#7a4d10\"><\u002Fcircle><circle cx=\"15.4\" cy=\"10.2\" r=\"1.2\" fill=\"#7a4d10\"><\u002Fcircle><path d=\"M8.6 14.4a4.2 4.2 0 0 0 6.8 0\" stroke=\"#7a4d10\" stroke-width=\"1.8\" fill=\"none\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n                One idea per request makes it easier for colleagues to support.\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div>\n              <div style=\"display:flex; align-items:baseline; gap:8px; margin-bottom:7px\">\n                <label style=\"font-size:14px; font-weight:700\">Why and how would this help you?<\u002Flabel>\n                <span style=\"font-size:11.5px; font-weight:700; color:#5c5648; background:#f4eee5; border-radius:4px; padding:2px 8px\">Optional<\u002Fspan>\n              <\u002Fdiv>\n              <textarea value=\"{{ formWhy }}\" sc-camel-on-change=\"{{ onFormWhy }}\" rows=\"4\" placeholder=\"What is getting in your way today, and what would change for you and your pupils?\" style=\"width:100%; border:1px solid #cfd3d3; border-radius:6px; padding:12px 14px; outline:none; resize:vertical; line-height:1.6; color:#171c1c\" style-focus=\"border-color:#00a884; box-shadow:0 0 0 4px rgba(0,168,132,.14)\"><\u002Ftextarea>\n            <\u002Fdiv>\n            <div>\n              <div style=\"display:flex; align-items:baseline; gap:8px; margin-bottom:7px\">\n                <label style=\"font-size:14px; font-weight:700\">When would you use it once it is live?<\u002Flabel>\n                <span style=\"font-size:11.5px; font-weight:700; color:#5c5648; background:#f4eee5; border-radius:4px; padding:2px 8px\">Optional<\u002Fspan>\n              <\u002Fdiv>\n              <textarea value=\"{{ formWhen }}\" sc-camel-on-change=\"{{ onFormWhen }}\" rows=\"3\" placeholder=\"e.g. every week when I prepare lessons, or at the start of a new chapter\" style=\"width:100%; border:1px solid #cfd3d3; border-radius:6px; padding:12px 14px; outline:none; resize:vertical; line-height:1.6; color:#171c1c\" style-focus=\"border-color:#00a884; box-shadow:0 0 0 4px rgba(0,168,132,.14)\"><\u002Ftextarea>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div sc-camel-on-click=\"{{ toggleFormTester }}\" style=\"display:flex; align-items:flex-start; gap:10px; margin-top:22px; cursor:pointer\">\n            <span style=\"{{ formTesterBox }}\">\n              <sc-if value=\"{{ formTester }}\" hint-placeholder-val=\"{{ false }}\">\n                <svg width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"3.4\"><path d=\"m5 13 4.5 4.5L19 7\"><\u002Fpath><\u002Fsvg>\n              <\u002Fsc-if>\n            <\u002Fspan>\n            <span style=\"font-size:13.5px; line-height:1.5; color:#2b3232\">Put me in the test group when this is built <span style=\"color:#8a8071\">— optional, you can step out at any time.<\u002Fspan><\u002Fspan>\n          <\u002Fdiv>\n\n          <div style=\"display:flex; justify-content:flex-end; gap:12px; margin-top:26px; padding-top:22px; border-top:1px dashed #e9e0d2\">\n            <div sc-camel-on-click=\"{{ goVote }}\" style=\"display:flex; align-items:center; padding:0 18px; height:42px; border-radius:6px; border:1px solid #00806a; font-weight:600; font-size:14px; cursor:pointer; color:#00806a; background:#fff\" style-hover=\"background:#e6f2ee\">Cancel<\u002Fdiv>\n            <div sc-camel-on-click=\"{{ submit }}\" style=\"{{ submitStyle }}\">Send it in<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isDone }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"padding:22px 34px 46px\">\n        <div style=\"background:#fff; border:1px solid #e9e0d2; border-radius:8px; padding:60px 32px; display:flex; flex-direction:column; align-items:center; text-align:center; width:100%; \">\n          <svg width=\"76\" height=\"76\" sc-camel-view-box=\"0 0 24 24\" style=\"margin-bottom:20px; animation:pop .6s ease-out\"><circle cx=\"12\" cy=\"12\" r=\"10\" fill=\"#00a884\"><\u002Fcircle><path d=\"M6.8 9.4c.9-1.1 2.4-1.1 3.3 0M14 9.4c.9-1.1 2.4-1.1 3.3 0\" stroke=\"#02513f\" stroke-width=\"1.8\" fill=\"none\" stroke-linecap=\"round\"><\u002Fpath><path d=\"M7.4 13.2h9.2a4.6 4.6 0 0 1-9.2 0Z\" fill=\"#02513f\"><\u002Fpath><\u002Fsvg>\n          <h2 style=\"margin:0 0 10px; font-size:24px; font-weight:800\">Your idea is live<\u002Fh2>\n          <div style=\"margin:24px 0 26px; background:#fdf9f3; border:1px solid #e9e0d2; border-radius:8px; padding:16px 20px; text-align:left; max-width:540px; width:100%\">\n            <div style=\"font-size:16.5px; font-weight:700; margin-bottom:6px\">{{ submittedTitle }}<\u002Fdiv>\n            <div style=\"color:#8a8071; font-size:13px\">Sent just now · 1 like (you)<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex; gap:12px; flex-wrap:wrap; justify-content:center\">\n            <div sc-camel-on-click=\"{{ goVote }}\" style=\"background:#00806a; color:#fff; border:1px solid #00806a; border-radius:6px; padding:0 18px; height:42px; display:flex; align-items:center; font-weight:600; font-size:14px; cursor:pointer\" style-hover=\"background:#00604f; border-color:#00604f\">Back to all ideas<\u002Fdiv>\n            <div sc-camel-on-click=\"{{ shareIdea }}\" style=\"{{ shareStyle }}\" style-hover=\"background:#f4f5f5\">\n              <sc-if value=\"{{ shareDone }}\" hint-placeholder-val=\"{{ false }}\">\n                <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\"><path d=\"m5 13 4.5 4.5L19 7\"><\u002Fpath><\u002Fsvg>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ shareIdle }}\" hint-placeholder-val=\"{{ true }}\">\n                <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><circle cx=\"18\" cy=\"5\" r=\"2.6\"><\u002Fcircle><circle cx=\"6\" cy=\"12\" r=\"2.6\"><\u002Fcircle><circle cx=\"18\" cy=\"19\" r=\"2.6\"><\u002Fcircle><path d=\"m8.4 10.7 7.2-4.2M8.4 13.3l7.2 4.2\"><\u002Fpath><\u002Fsvg>\n              <\u002Fsc-if>\n              {{ shareLabel }}\n            <\u002Fdiv>\n            <div sc-camel-on-click=\"{{ goRequest }}\" style=\"display:flex; align-items:center; padding:0 18px; height:42px; border-radius:6px; border:1px solid #00806a; font-weight:600; font-size:14px; cursor:pointer; color:#00806a; background:#fff\" style-hover=\"background:#e6f2ee\">Tell us another<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fmain>\n\n  <sc-if value=\"{{ modalOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div sc-camel-on-click=\"{{ closeModal }}\" style=\"position:fixed; inset:0; background:rgba(40,32,22,.42); display:flex; align-items:center; justify-content:center; padding:32px; z-index:50\">\n      <div sc-camel-on-click=\"{{ stopClick }}\" style=\"background:#fff; border-radius:10px; width:100%; max-width:700px; max-height:88vh; overflow-y:auto; box-shadow:0 22px 60px rgba(40,32,22,.3); animation:riseIn .22s ease-out\">\n        <div style=\"{{ modal.headerStyle }}\">\n          <div style=\"display:flex; align-items:flex-start; gap:16px\">\n            <div style=\"flex:1; min-width:0; display:flex; flex-direction:column; gap:12px\">\n              <div style=\"display:flex; align-items:center; gap:8px; flex-wrap:wrap\">\n                <span style=\"{{ modal.chipStyle }}\">{{ modal.stage }}<\u002Fspan>\n                <span style=\"{{ modal.topicStyle }}\">{{ modal.topicLabel }}<\u002Fspan>\n              <\u002Fdiv>\n              <h2 style=\"margin:0; font-size:24px; font-weight:800; letter-spacing:-.5px; line-height:1.25; text-wrap:pretty\">{{ modal.title }}<\u002Fh2>\n            <\u002Fdiv>\n            <div sc-camel-on-click=\"{{ closeModal }}\" style=\"flex:0 0 auto; width:36px; height:36px; border-radius:6px; display:flex; align-items:center; justify-content:center; color:#5c5648; cursor:pointer; background:rgba(255,255,255,.6)\" style-hover=\"background:#fff\">\n              <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\"><path d=\"M6 6l12 12M18 6 6 18\"><\u002Fpath><\u002Fsvg>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-top:16px; background:#fff; border:1px solid rgba(0,0,0,.06); border-radius:8px; padding:12px 14px\">\n            <button type=\"button\" disabled=\"{{ modal.voteDisabled }}\" sc-camel-on-click=\"{{ modal.onVote }}\" style=\"{{ modal.heroVoteStyle }}\" style-hover=\"{{ modal.heroVoteHover }}\">\n              <sc-if value=\"{{ modal.showSmile }}\" hint-placeholder-val=\"{{ false }}\">\n                <svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" style=\"flex:0 0 auto\"><path d=\"M7 10.5h2.2l2.6-5.9a1.7 1.7 0 0 1 3.2.7v3.6h3.1a2 2 0 0 1 2 2.4l-1.1 5.3A2.4 2.4 0 0 1 16.6 19H7v-8.5Z\" fill=\"#ffc44d\" stroke=\"#7a4d10\" stroke-width=\"1.5\" stroke-linejoin=\"round\"><\u002Fpath><rect x=\"3\" y=\"10\" width=\"4\" height=\"9.2\" rx=\"1.2\" fill=\"#ffc44d\" stroke=\"#7a4d10\" stroke-width=\"1.5\"><\u002Frect><\u002Fsvg>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ modal.showGrin }}\" hint-placeholder-val=\"{{ false }}\">\n                <svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" style=\"flex:0 0 auto\"><path d=\"M7 10.5h2.2l2.6-5.9a1.7 1.7 0 0 1 3.2.7v3.6h3.1a2 2 0 0 1 2 2.4l-1.1 5.3A2.4 2.4 0 0 1 16.6 19H7v-8.5Z\" fill=\"#00a884\" stroke=\"#02513f\" stroke-width=\"1.5\" stroke-linejoin=\"round\"><\u002Fpath><rect x=\"3\" y=\"10\" width=\"4\" height=\"9.2\" rx=\"1.2\" fill=\"#00a884\" stroke=\"#02513f\" stroke-width=\"1.5\"><\u002Frect><\u002Fsvg>\n              <\u002Fsc-if>\n              {{ modal.voteLabel }}\n            <\u002Fbutton>\n            <span style=\"flex:1; min-width:180px; font-size:13px; line-height:1.5; color:#5c5648\">{{ modal.supportHint }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"padding:20px 28px 0\">\n          <div style=\"{{ modal.testBoxStyle }}\">\n            <div style=\"display:flex; align-items:flex-start; gap:12px; flex-wrap:wrap\">\n              <svg width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 24 24\" style=\"flex:0 0 auto; margin-top:1px\"><circle cx=\"12\" cy=\"12\" r=\"10\" fill=\"#0b64b3\"><\u002Fcircle><circle cx=\"8.6\" cy=\"10\" r=\"1.3\" fill=\"#fff\"><\u002Fcircle><circle cx=\"15.4\" cy=\"10\" r=\"1.3\" fill=\"#fff\"><\u002Fcircle><path d=\"M8.4 14.2c1.8 1.6 5.4 1.6 7.2 0\" stroke=\"#fff\" stroke-width=\"1.8\" fill=\"none\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n              <div style=\"flex:1; min-width:220px\">\n                <div style=\"font-size:15px; font-weight:700; margin-bottom:3px\">{{ modal.testTitle }}<\u002Fdiv>\n                <p style=\"margin:0 0 8px; font-size:13.5px; line-height:1.55; color:#5c5648; text-wrap:pretty\">{{ modal.testBody }}<\u002Fp>\n                <div style=\"display:flex; align-items:center; gap:7px; font-size:13px; font-weight:700; color:#0b3f70\">\n                  <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M16 20v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2\"><\u002Fpath><circle cx=\"9.5\" cy=\"7\" r=\"3.2\"><\u002Fcircle><path d=\"M17 11a3 3 0 1 0 0-6M21 20v-2a3.6 3.6 0 0 0-2.4-3.4\"><\u002Fpath><\u002Fsvg>\n                  {{ modal.testerLine }}\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <sc-if value=\"{{ modal.showTestButton }}\" hint-placeholder-val=\"{{ false }}\">\n                <button type=\"button\" sc-camel-on-click=\"{{ modal.applyTest }}\" style=\"display:flex; align-items:center; gap:8px; height:42px; padding:0 18px; border-radius:6px; font-size:14px; font-weight:600; cursor:pointer; border:1px solid #0b64b3; background:#0b64b3; color:#fff; transition:background .15s ease; white-space:nowrap\" style-hover=\"background:#09507f; border-color:#09507f\">\n                  <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\"><path d=\"M9 11V6a3 3 0 0 1 6 0v5M6 11h12l-1.2 9H7.2L6 11Z\"><\u002Fpath><\u002Fsvg>\n                  Yes, I want to test it\n                <\u002Fbutton>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ modal.testApplied }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"display:flex; align-items:center; gap:8px; height:42px; padding:0 16px; border-radius:6px; font-size:14px; font-weight:600; border:1px solid #cfe0f2; background:#e9f2fb; color:#0b3f70; white-space:nowrap\">\n                  <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\"><path d=\"m5 13 4.5 4.5L19 7\"><\u002Fpath><\u002Fsvg>\n                  You are on the test list\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"padding:20px 28px 0; display:flex; flex-wrap:wrap; gap:10px\">\n          <div style=\"flex:1; min-width:150px; background:#fdf9f3; border:1px solid #e9e0d2; border-radius:8px; padding:12px 15px\">\n            <div style=\"font-size:10.5px; font-weight:800; letter-spacing:.8px; text-transform:uppercase; color:#9b9183; margin-bottom:4px\">Support<\u002Fdiv>\n            <div style=\"font-size:19px; font-weight:800\">{{ modal.votes }} <span style=\"font-size:13px; font-weight:700; color:#8a8071\">{{ modal.votesLabel }}<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"flex:1; min-width:150px; background:#fdf9f3; border:1px solid #e9e0d2; border-radius:8px; padding:12px 15px\">\n            <div style=\"font-size:10.5px; font-weight:800; letter-spacing:.8px; text-transform:uppercase; color:#9b9183; margin-bottom:4px\">Submitted<\u002Fdiv>\n            <div style=\"font-size:15px; font-weight:700\">{{ modal.date }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"flex:1; min-width:150px; background:#fdf9f3; border:1px solid #e9e0d2; border-radius:8px; padding:12px 15px\">\n            <div style=\"font-size:10.5px; font-weight:800; letter-spacing:.8px; text-transform:uppercase; color:#9b9183; margin-bottom:4px\">Stage<\u002Fdiv>\n            <div style=\"font-size:15px; font-weight:700\">{{ modal.stage }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"padding:22px 28px 0\">\n          <h3 style=\"margin:0 0 8px; font-size:12px; font-weight:800; letter-spacing:1px; text-transform:uppercase; color:#9b9183\">Description<\u002Fh3>\n          <p style=\"margin:0; font-size:15px; line-height:1.65; color:#2b3232; white-space:pre-line; text-wrap:pretty\">{{ modal.detail }}<\u002Fp>\n        <\u002Fdiv>\n\n        <div style=\"padding:24px 28px 0; margin-top:22px; border-top:1px dashed #e9e0d2\">\n          <h3 style=\"margin:0 0 4px; font-size:12px; font-weight:800; letter-spacing:1px; text-transform:uppercase; color:#9b9183\">{{ commentHeading }}<\u002Fh3>\n          <p style=\"margin:0 0 16px; color:#8a8071; font-size:13px; line-height:1.5\">Ask a question or add what would make this idea work in your lessons.<\u002Fp>\n\n          <sc-if value=\"{{ hasComments }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"display:flex; flex-direction:column; gap:12px; margin-bottom:20px\">\n              <sc-for list=\"{{ comments }}\" as=\"c\" hint-placeholder-count=\"2\">\n                <div style=\"display:flex; gap:12px\">\n                  <div style=\"{{ c.avatarStyle }}\">{{ c.initials }}<\u002Fdiv>\n                  <div style=\"{{ c.bubbleStyle }}\">\n                    <div style=\"display:flex; align-items:baseline; column-gap:10px; row-gap:2px; flex-wrap:wrap; margin-bottom:5px\">\n                      <span style=\"font-size:14px; font-weight:800\">{{ c.author }}<\u002Fspan>\n                      <span style=\"font-size:12px; color:#8a8071\">{{ c.role }}<\u002Fspan>\n                      <span style=\"font-size:12px; color:#a9a093\">{{ c.when }}<\u002Fspan>\n                    <\u002Fdiv>\n                    <p style=\"margin:0; font-size:14px; line-height:1.6; color:#2b3232; text-wrap:pretty\">{{ c.text }}<\u002Fp>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <div style=\"display:flex; gap:12px\">\n            <div style=\"flex:0 0 36px; width:36px; height:36px; border-radius:6px; background:linear-gradient(135deg,#00a884,#00806a); color:#fff; font-size:12px; font-weight:800; display:flex; align-items:center; justify-content:center\">PS<\u002Fdiv>\n            <div style=\"flex:1; min-width:0\">\n              <textarea value=\"{{ draft }}\" sc-camel-on-change=\"{{ onDraft }}\" rows=\"3\" placeholder=\"Write a comment…\" style=\"width:100%; border:1px solid #cfd3d3; border-radius:6px; padding:10px 13px; outline:none; resize:vertical; line-height:1.6; font-size:14px; color:#171c1c\" style-focus=\"border-color:#00a884; box-shadow:0 0 0 4px rgba(0,168,132,.14)\"><\u002Ftextarea>\n              <div style=\"display:flex; justify-content:flex-end; margin-top:10px\">\n                <button type=\"button\" sc-camel-on-click=\"{{ postComment }}\" style=\"{{ postStyle }}\">Post comment<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex; align-items:center; justify-content:flex-end; gap:12px; margin-top:26px; padding:18px 28px; border-top:1px solid #efe7db; position:sticky; bottom:0; background:#fff\">\n          <div sc-camel-on-click=\"{{ closeModal }}\" style=\"display:flex; align-items:center; height:42px; padding:0 18px; border-radius:6px; border:1px solid #00806a; color:#00806a; background:#fff; font-weight:600; font-size:14px; cursor:pointer\" style-hover=\"background:#e6f2ee\">Close<\u002Fdiv>\n          <div sc-camel-on-click=\"{{ shareIdea }}\" style=\"{{ shareStyle }}\" style-hover=\"background:#e6f2ee\">\n            <sc-if value=\"{{ shareDone }}\" hint-placeholder-val=\"{{ false }}\">\n              <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\"><path d=\"m5 13 4.5 4.5L19 7\"><\u002Fpath><\u002Fsvg>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ shareIdle }}\" hint-placeholder-val=\"{{ true }}\">\n              <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><circle cx=\"18\" cy=\"5\" r=\"2.6\"><\u002Fcircle><circle cx=\"6\" cy=\"12\" r=\"2.6\"><\u002Fcircle><circle cx=\"18\" cy=\"19\" r=\"2.6\"><\u002Fcircle><path d=\"m8.4 10.7 7.2-4.2M8.4 13.3l7.2 4.2\"><\u002Fpath><\u002Fsvg>\n            <\u002Fsc-if>\n            {{ shareLabel }}\n          <\u002Fdiv>\n          <button type=\"button\" disabled=\"{{ modal.voteDisabled }}\" sc-camel-on-click=\"{{ modal.onVote }}\" style=\"{{ modal.voteStyle }}\" style-hover=\"{{ modal.heroVoteHover }}\">\n            <sc-if value=\"{{ modal.showSmile }}\" hint-placeholder-val=\"{{ false }}\">\n              <svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" style=\"flex:0 0 auto\"><path d=\"M7 10.5h2.2l2.6-5.9a1.7 1.7 0 0 1 3.2.7v3.6h3.1a2 2 0 0 1 2 2.4l-1.1 5.3A2.4 2.4 0 0 1 16.6 19H7v-8.5Z\" fill=\"#ffc44d\" stroke=\"#7a4d10\" stroke-width=\"1.5\" stroke-linejoin=\"round\"><\u002Fpath><rect x=\"3\" y=\"10\" width=\"4\" height=\"9.2\" rx=\"1.2\" fill=\"#ffc44d\" stroke=\"#7a4d10\" stroke-width=\"1.5\"><\u002Frect><\u002Fsvg>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ modal.showGrin }}\" hint-placeholder-val=\"{{ false }}\">\n              <svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" style=\"flex:0 0 auto\"><path d=\"M7 10.5h2.2l2.6-5.9a1.7 1.7 0 0 1 3.2.7v3.6h3.1a2 2 0 0 1 2 2.4l-1.1 5.3A2.4 2.4 0 0 1 16.6 19H7v-8.5Z\" fill=\"#00a884\" stroke=\"#02513f\" stroke-width=\"1.5\" stroke-linejoin=\"round\"><\u002Fpath><rect x=\"3\" y=\"10\" width=\"4\" height=\"9.2\" rx=\"1.2\" fill=\"#00a884\" stroke=\"#02513f\" stroke-width=\"1.5\"><\u002Frect><\u002Fsvg>\n            <\u002Fsc-if>\n            {{ modal.voteLabel }}\n          <\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;playful&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Play&quot;},&quot;emptyState&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;States&quot;}}\">\nconst THRESHOLD = 150;\n\nconst SEED = [\n  { id: 1, title: \"Build a quiz by picking chapters or learning objectives\", body: \"I want to put a quiz together in a few clicks, save it and reuse it next year — the way it worked in the previous version.\", status: \"open\", date: \"3 Sep 2026\", votes: 118, voted: false, detail: \"I want to put a quiz together in a few clicks, save it and reuse it next year — the way it worked in the previous version.\\n\\nI pick the chapters or the learning objectives, the platform proposes the exercises, and I keep the ones I want. One click to save, and the quiz stays in my own list so I can hand it out to another class later without building it again.\" },\n  { id: 2, title: \"Sort e-books in a simple alphabetical list by level, edition and book part\", body: \"My bookshelf is a wall of covers. A plain sorted list would let me find the right part in seconds.\", status: \"open\", date: \"9 Sep 2026\", votes: 96, voted: false, detail: \"My bookshelf is a wall of covers. A plain sorted list would let me find the right part in seconds.\\n\\nSorting alphabetically with level, edition and book part visible as columns means I no longer open three wrong books before I find part 2 of the new edition.\" },\n  { id: 3, title: \"Arrange books in my own order on my bookshelf\", body: \"I teach four levels. The books I use every day should be first, not the ones I opened once.\", status: \"open\", date: \"10 Sep 2026\", votes: 74, voted: true, mine: true, detail: \"I teach four levels. The books I use every day should be first, not the ones I opened once.\\n\\nLet me drag the books into my own order and hide the ones I am not using this year. My bookshelf then matches my timetable instead of the catalogue.\" },\n  { id: 4, title: \"Copy pages for worksheets and drag them into PowerPoint\", body: \"I build my own worksheets and slides. Copying a page out of the e-book is the step that always breaks.\", status: \"open\", date: \"1 Sep 2026\", votes: 131, voted: false, detail: \"I build my own worksheets and slides. Copying a page out of the e-book is the step that always breaks.\\n\\nA copy action on a page that keeps the layout, so I can paste it straight into a worksheet or drag it onto a PowerPoint slide for the lesson.\" },\n  { id: 5, title: \"Practice tests and quiz bundles organised by chapter\", body: \"Everything sits in one long list, so I scroll to find the test that belongs to the chapter I am teaching.\", status: \"open\", date: \"11 Sep 2026\", votes: 63, voted: false, detail: \"Everything sits in one long list, so I scroll to find the test that belongs to the chapter I am teaching.\\n\\nGroup practice tests and quiz bundles under the chapter they belong to, so preparing a lesson takes one click instead of a search.\" },\n  { id: 6, title: \"Know what percentage of my class has mastered a chapter\", body: \"For differentiation and for reporting I need one number per chapter, not a table I have to interpret.\", status: \"open\", date: \"7 Sep 2026\", votes: 88, voted: true, detail: \"For differentiation and for reporting I need one number per chapter, not a table I have to interpret.\\n\\nA simple percentage per chapter — mastered, on the way, not started — would tell me whether I can move on or need one more lesson on it.\" },\n  { id: 7, title: \"Switch between books and classes without losing my place\", body: \"Every switch drops me back at the start, and during a lesson that costs minutes I do not have.\", status: \"roadmap\", date: \"18 Aug 2026\", votes: 241, voted: false, milestone: \"Reached 150 backers on 30 Aug 2026 · planned for Q1\", detail: \"Every switch drops me back at the start, and during a lesson that costs minutes I do not have.\\n\\nRemember where I was per book and per class, so switching brings me back to the page I was teaching.\" },\n  { id: 8, title: \"Print lesson plans for preparation\", body: \"I prepare on paper, in the train. A printable lesson plan per chapter would save me copying it by hand.\", status: \"roadmap\", date: \"22 Jul 2026\", votes: 174, voted: true, mine: true, milestone: \"Requested by you · reached 150 backers on 6 Sep 2026\" },\n  { id: 9, title: \"See immediately who submitted an assignment and what they scored\", body: \"I should not have to wait until everything is marked as ready before I can see the first results.\", status: \"building\", date: \"12 Aug 2026\", votes: 312, voted: true, milestone: \"Reached 150 backers on 26 Aug 2026 · in development since 1 Sep\", detail: \"I should not have to wait until everything is marked as ready before I can see the first results.\\n\\nA live list per assignment: who handed in, when, and what they scored. That way I can start giving feedback the same evening instead of the next week.\" },\n  { id: 10, title: \"Detailed insight per chapter, per class and per pupil\", body: \"I want to read \\\"this class struggles with fractions\\\" or \\\"this pupil is missing the grammar exercises\\\" at a glance.\", status: \"building\", date: \"19 Jun 2026\", votes: 186, voted: false, milestone: \"Reached 150 backers on 2 Jul 2026 · first version in October\", detail: \"I want to read \\\"this class struggles with fractions\\\" or \\\"this pupil is missing the grammar exercises\\\" at a glance.\\n\\nPer chapter, per class and per pupil, with the weakest exercises named. That is what I use to decide what the next lesson is about.\" },\n  { id: 11, title: \"Direct button to teacher materials in the left menu\", body: \"Teacher materials are three clicks deep. During a lesson that is two clicks too many.\", status: \"building\", date: \"4 Jul 2026\", votes: 163, voted: false, milestone: \"Reached 150 backers on 9 Jul 2026 · in development since 25 Aug\" },\n  { id: 12, title: \"Student view toggle — see exactly what learners see\", body: \"Half my questions from pupils are about what is on their screen, and I cannot see it.\", status: \"shipped\", date: \"9 Feb 2026\", votes: 221, voted: false, milestone: \"Live since 15 Jun 2026 — thanks to 221 teachers\", detail: \"Half my questions from pupils are about what is on their screen, and I cannot see it.\\n\\nA toggle that shows the pupil view of the same page, so I can talk them through it without asking them to read it out.\" },\n  { id: 13, title: \"Give me back the results dashboard\", body: \"The old dashboard answered in one screen what now takes me four exports.\", status: \"shipped\", date: \"21 Jun 2026\", votes: 208, voted: true, mine: true, milestone: \"Requested by you · live since 2 Sep 2026\" },\n  { id: 14, title: \"Search and filter books by grade level and edition\", body: \"Finding the right edition used to mean opening covers one by one.\", status: \"shipped\", date: \"14 Mar 2026\", votes: 254, voted: false, milestone: \"Live since 20 Aug 2026 — thanks to 254 teachers\" }\n];\n\nconst TOPICS = [\n  { key: \"testing\", label: \"Testing & assessment\", ink: \"#a8325a\", soft: \"#ffe7ef\", edge: \"#f7cfdd\" },\n  { key: \"findability\", label: \"Findability & navigation\", ink: \"#0b64b3\", soft: \"#e7f2fd\", edge: \"#c8e0f6\" },\n  { key: \"content\", label: \"Content\", ink: \"#5b3fd6\", soft: \"#ece6ff\", edge: \"#ddd2fb\" },\n  { key: \"class\", label: \"Teaching in class\", ink: \"#00705c\", soft: \"#dcf3ec\", edge: \"#bfe8dc\" },\n  { key: \"results\", label: \"Results & progress\", ink: \"#b5590a\", soft: \"#ffeed3\", edge: \"#f7dfb8\" }\n];\n\nconst TESTERS_SEED = { 1: 21, 2: 9, 3: 12, 4: 18, 5: 6, 6: 14, 7: 42, 8: 26, 9: 38, 10: 31, 11: 17, 12: 24, 13: 29, 14: 11 };\n\nconst COMMENTS = {\n  1: [\n    { id: \"c1\", author: \"Marieke de Vries\", initials: \"MV\", role: \"Mathematics · Stedelijk Lyceum\", when: \"4 Sep 2026\", text: \"Please let me pick learning objectives as well as chapters. I test per objective, not per chapter, and that is exactly what I lost in the new version.\" },\n    { id: \"c2\", author: \"Tom Bakker\", initials: \"TB\", role: \"Physics · De Nieuwste School\", when: \"6 Sep 2026\", text: \"Saving is the important part for me. I build one good quiz and then use it for three classes and again next year.\" },\n    { id: \"c3\", author: \"Product team\", initials: \"PT\", role: \"Infinitas Learning\", when: \"10 Sep 2026\", text: \"Thanks both — we are looking at chapter and objective selection with a save-and-reuse list. We will share a first version here before we build it.\", team: true }\n  ],\n  4: [\n    { id: \"c4\", author: \"Sanne Willems\", initials: \"SW\", role: \"Dutch · Het Baken\", when: \"30 Aug 2026\", text: \"Keeping the layout is what matters. If the copy comes out as loose text I still have to rebuild the exercise in Word.\" }\n  ],\n  6: [\n    { id: \"c7\", author: \"Joost Hendriks\", initials: \"JH\", role: \"Biology · Corlaer College\", when: \"12 Sep 2026\", text: \"One percentage per chapter is enough for me, as long as I can click through to see which pupils are behind it.\" }\n  ],\n  7: [\n    { id: \"c5\", author: \"Ahmed el Amrani\", initials: \"AA\", role: \"ICT coordinator · Rijnlands Lyceum\", when: \"2 Sep 2026\", text: \"Please remember the position per class too, not only per book. I teach the same chapter to four groups at different speeds.\" },\n    { id: \"c6\", author: \"Product team\", initials: \"PT\", role: \"Infinitas Learning\", when: \"8 Sep 2026\", text: \"Planned for Q1, and yes — the last position is stored per book and per class.\", team: true }\n  ],\n  9: [\n    { id: \"c8\", author: \"Product team\", initials: \"PT\", role: \"Infinitas Learning\", when: \"14 Sep 2026\", text: \"In development now. The first version shows submissions live per assignment; the score column follows two weeks later.\", team: true }\n  ]\n};\n\nconst CATEGORIES = [\n  { key: \"sep\", label: \"SEP\", ink: \"#0b64b3\", soft: \"#e7f2fd\", edge: \"#c8e0f6\" },\n  { key: \"pep\", label: \"PEP\", ink: \"#5b3fd6\", soft: \"#ece6ff\", edge: \"#ddd2fb\" },\n  { key: \"licenses\", label: \"Licenses\", ink: \"#a8325a\", soft: \"#ffe7ef\", edge: \"#f7cfdd\" },\n  { key: \"admin\", label: \"Admin\", ink: \"#5c5648\", soft: \"#f4eee5\", edge: \"#e5dbcb\" },\n  { key: \"player\", label: \"Player\", ink: \"#00705c\", soft: \"#dcf3ec\", edge: \"#bfe8dc\" },\n  { key: \"planner\", label: \"Planner\", ink: \"#b5590a\", soft: \"#ffeed3\", edge: \"#f7dfb8\" },\n  { key: \"reporting\", label: \"Reporting\", ink: \"#0b64b3\", soft: \"#e7f2fd\", edge: \"#c8e0f6\" },\n  { key: \"importexport\", label: \"Import & export\", ink: \"#5b3fd6\", soft: \"#ece6ff\", edge: \"#ddd2fb\" },\n  { key: \"notifications\", label: \"Notifications\", ink: \"#a8325a\", soft: \"#ffe7ef\", edge: \"#f7cfdd\" },\n  { key: \"accessibility\", label: \"Accessibility\", ink: \"#00705c\", soft: \"#dcf3ec\", edge: \"#bfe8dc\" }\n];\n\nconst TOPIC_OF = { 1: \"testing\", 2: \"findability\", 3: \"findability\", 4: \"class\", 5: \"findability\", 6: \"results\", 7: \"class\", 8: \"class\", 9: \"testing\", 10: \"results\", 11: \"findability\", 12: \"results\", 13: \"results\", 14: \"findability\" };\n\nconst TABS = [\n  { key: \"open\", label: \"Open for backing\", color: \"#00806a\", soft: \"#dcf3ec\" },\n  { key: \"building\", label: \"Getting built\", color: \"#c2610a\", soft: \"#ffeed3\" },\n  { key: \"shipped\", label: \"Delivered\", color: \"#1c5f4a\", soft: \"#dff3e6\" },\n  { key: \"mine\", label: \"My ideas\", color: \"#7b5cff\", soft: \"#ece6ff\" }\n];\n\nconst INTRO = {\n  open: \"Which ideas from other teachers would help in your daily work? Like the ideas that would help you, or join the discussion — more likes mean quicker action from our team.\",\n  building: \"Work has started on these. Enough colleagues backed them, they went in progress, and the team is building them now.\",\n  shipped: \"Delivered because teachers asked for it. Every one of these started as a request on this page.\",\n  mine: \"The ideas you submitted or supported, and how far they have come.\"\n};\n\nconst TIERS = [\n  { min: 0, name: \"spark\", ink: \"#7b5cff\", soft: \"#f0ecff\", edge: \"#d9cffc\", bar: \"linear-gradient(90deg,#9b83ff,#7b5cff)\" },\n  { min: 50, name: \"sky\", ink: \"#0b64b3\", soft: \"#e7f2fd\", edge: \"#c8e0f6\", bar: \"linear-gradient(90deg,#43a9ea,#0b64b3)\" },\n  { min: 100, name: \"almost\", ink: \"#c2610a\", soft: \"#fff1da\", edge: \"#f6dcb4\", bar: \"linear-gradient(90deg,#ffc44d,#f08a24)\" }\n];\n\nconst SKIN = {\n  shipped: { label: \"Delivered\", accent: \"#146c50\", bg: \"#effaf3\", border: \"#c6e8d4\", chip: \"color:#0f5c43; background:#d6f2e0\", bar: \"linear-gradient(90deg,#4bd39b,#00a884)\" },\n  building: { label: \"In development\", accent: \"#b5590a\", bg: \"#fff8ec\", border: \"#f7dfb  for likes\" : \" ideas waiting for likes\"),\n      roadmapHeading: roadmap.length === 1 ? \"1 idea is in progress\" : roadmap.length + \" ideas are in progress\",\n\n      emptyTitle: tab === \"mine\" ? \"You have not taken part yet\"\n        : tab === \"shipped\" ? \"Nothing delivered yet\"\n        : tab === \"building\" ? \"Nothing is in progress yet\"\n        : s.query.trim() ? \"No ideas match your search\" : \"No ideas yet\",\n      emptyBody: tab === \"mine\" ? \"Ideas you submit and ideas you back appear here, with their progress.\"\n        : tab === \"shipped\" ? \"As soon as a backed idea goes live, it is celebrated here.\"\n        : tab === \"building\" ? \"Ideas move here automatically once 150 teachers have backed them.\"\n        : s.query.trim() ? \"Try a different search term.\" : \"Be the first to tell us what would make teaching with the platform easier.\",\n\n      query: s.query,\n      onQuery: e => this.setState({ query: e.target.value }),\n\n      formTitle: s.formTitle,\n      formBody: s.formBody,\n      onFormTitle: e => this.setState({ formTitle: e.target.value }),\n      onFormBody: e => this.setState({ formBody: e.target.value }),\n      submittedTitle: s.submittedTitle || \"Your request\",\n      submitStyle: \"display:flex; align-items:center; padding:0 18px; height:42px; border-radius:6px; font-weight:600; font-size:14px; color:#fff; background:\" +\n        (canSubmit ? \"#00806a; cursor:pointer\" : \"#c3ccca; cursor:not-allowed\"),\n\n      goVote: () => this.setState({ screen: \"list\", tab: \"open\" }),\n      goRequest: () => this.setState({ screen: \"form\", tab: \"open\", formTitle: \"\", formBody: \"\", formWhy: \"\", formWhen: \"\" }),\n      submit: () => {\n        if (!canSubmit) return;\n        const newId = Date.now();\n        this.setState(st => ({\n          screen: \"done\",\n          submittedTitle: st.formTitle.trim(),\n          testers: st.formTester ? { ...st.testers, [newId]: true } : st.testers,\n
